# ═════════════════════════════════════════════════════════════════════
#  ROBOT EMPLOI CI — configuration
#  Le seul fichier à modifier pour changer ce que le robot cherche.
#  Les secrets (SMTP, Telegram) vivent dans .env, pas ici.
# ═════════════════════════════════════════════════════════════════════

profil:
  nom: "Ouattara Yaya"
  # Intitulés visés. Un intitulé retrouvé dans le titre d'une annonce
  # pèse lourd dans le score ; retrouvé dans le corps, il pèse peu.
  intitules:
    - developpeur
    - développeur
    - developer
    - fullstack
    - full stack
    - front end
    - back end
    - web
    - logiciel
    - software
    - ingenieur informatique
    - data analyst
    - analyste de donnees
    - agroeconomiste
    - agro-economiste
    - agronome
    - suivi evaluation
    - chargé d'études

  # Compétences. Chacune ajoute des points quand elle apparaît.
  competences:
    - python
    - javascript
    - typescript
    - react
    - node
    - django
    - flask
    - php
    - laravel
    - sql
    - postgresql
    - mysql
    - api
    - git
    - docker
    - tailwind
    - power bi
    - excel
    - kobotoolbox
    - stata
    - intelligence artificielle

  # Si l'un de ces mots apparaît dans le titre, l'annonce est écartée
  # sans discussion — quel que soit son score.
  exclusions:
    - commercial terrain
    - télévendeur
    - televendeur
    - vendeur
    - chauffeur
    - agent de securite
    - agent de sécurité
    - stage non rémunéré
    - manutentionnaire

  # Lieux acceptés. Une annonce hors de ces lieux perd des points sans
  # être écartée (le télétravail reste intéressant). Vide = partout.
  lieux:
    - côte d'ivoire
    - cote d'ivoire
    - abidjan
    - yamoussoukro
    - bouaké
    - bouake
    - remote
    - télétravail
    - teletravail

  # Score minimum pour qu'une annonce entre dans le rapport.
  # Monter ce seuil si le rapport est trop bavard.
  score_minimum: 8

# ─── Sources surveillées ─────────────────────────────────────────────
# activee: false suffit à mettre une source en sommeil.
sources:
  linkedin:
    activee: true
    # Une recherche par mot-clé. Le robot les enchaîne.
    recherches:
      - "développeur"
      - "developer"
      - "data analyst"
      - "agro"
    lieu: "Côte d'Ivoire"
    pages: 2            # 25 annonces par page
    # Âge maximum des annonces : r86400 = 24 h, r604800 = 7 jours.
    anciennete: "r604800"

  novojob:
    activee: true
    # Une adresse = une page d'annonces. La première est la liste
    # générale ; les suivantes ciblent des rubriques métier.
    # Le catalogue complet : /cote-d-ivoire/offres-d-emploi/offres-par-fonction
    urls:
      - "https://www.novojob.com/cote-d-ivoire/offres-d-emploi"
      - "https://www.novojob.com/cote-d-ivoire/offres-d-emploi/offres-par-fonction/365-informatique-systemes-d-information-internet"
      - "https://www.novojob.com/cote-d-ivoire/offres-d-emploi/offres-par-fonction/369-ingenierie-etudes-projet-r-d"

  jobnetafrica:
    activee: true
    url: "https://jobnetafrica.com/jobs/"
    # Filtre pays appliqué après récupération (la page liste toute
    # l'Afrique). Vide = on garde tout.
    pays:
      - "Ivory Coast"
      - "Cote d'Ivoire"
      - "Côte d'Ivoire"
      - "Remote"

  emploici:
    # EN SOMMEIL — constaté le 17/09/2026 : Cloudflare sert un challenge
    # Turnstile qui ne cède ni en headless, ni en fenêtre réelle avec
    # profil persistant. Même /robots.txt répond 403. Novojob prend le
    # relais sur le même gisement d'annonces ivoiriennes.
    # Repasser à true pour retenter (le code est prêt).
    activee: false
    url: "https://www.emploi.ci/recherche-jobs-cote-ivoire"
    pages: 2
    # emploi.ci est derrière Cloudflare : une requête HTTP simple reçoit
    # une page de défi, pas les annonces. Avec navigateur: true et
    # Playwright installé, le robot ouvre un vrai Chromium et passe.
    # Sans Playwright, la source est sautée avec un avertissement, et
    # le reste du cycle continue normalement.
    navigateur: true

  afriwork:
    # EN SOMMEIL — afriworket.com est « Afriwork Ethiopia » (numéros
    # +251), pas une source ivoirienne, et ses annonces exigent un
    # compte. Le module reste en place : il suffit de lui donner la
    # bonne adresse dans « url » et de repasser à true.
    activee: false
    url: "https://afriworket.com/jobs"
    navigateur: true

# ─── Planification ───────────────────────────────────────────────────
planification:
  intervalle_heures: 6     # un rapport toutes les six heures
  max_offres_par_rapport: 40

# ─── Sorties ─────────────────────────────────────────────────────────
sorties:
  email: true
  telegram: true
  excel: true
  dossier_exports: "exports"

# ─── Réseau ──────────────────────────────────────────────────────────
reseau:
  delai_entre_requetes: 2.5   # secondes — on reste poli avec les sites
  timeout: 25
  tentatives: 3
